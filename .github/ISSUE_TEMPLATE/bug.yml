name: Something is broken
description: A layout bug, a dead link, a page that doesn't load
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: url
    attributes:
      label: Page
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: Safari on iPhone 15
